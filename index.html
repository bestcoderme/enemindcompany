    <!-- Google Identity Services (GSI) for Google Workspace client OAuth flows -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Decode GitHub Pages SPA redirects from 404.html
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-[#F3F4F6] text-gray-900 antialiased selection:bg-black selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clear any stale development service workers that might intercept module scripts
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (const registration of registrations) {
            registration.unregister();
          }
        }).catch(() => {});
      }
    </script>
  </body>
